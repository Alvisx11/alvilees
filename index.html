<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alvilees | Produtos Online</title>
  <style>
    /* Reset e fonte */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(to right, #f0f4f8, #d9e2ec);
      color: #333;
    }

    /* Cabeçalho */
    header {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 40px 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 3em;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    header p {
      font-size: 1.2em;
      color: #ecf0f1;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    /* Seções */
    h2.section-title {
      text-align: center;
      margin: 50px 0 30px;
      font-size: 2em;
      color: #2c3e50;
      position: relative;
    }

    h2.section-title::after {
      content: '';
      display: block;
      width: 80px;
      height: 3px;
      background: #3498db;
      margin: 10px auto 0;
      border-radius: 2px;
    }

    /* Produtos */
    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .produto {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
    }

    .produto:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .produto img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .produto-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .produto h3 {
      font-size: 1.5em;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .produto p {
      font-size: 1em;
      line-height: 1.6;
      color: #555;
      margin-bottom: 15px;
    }

      font-size: 1.4em;
